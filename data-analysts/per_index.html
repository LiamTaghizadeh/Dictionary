<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>واژه‌نامه مبانی آمار</title>

  <!-- ===== فونت فارسی باکیفیت (Vazirmatn) ===== -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet" />

  <style>
    /* ===== استایل پایه با فونت فارسی ===== */
    :root {
      --bg:       #08090d;
      --bg2:      #0e1018;
      --bg3:      #14161f;
      --bg4:      #1c1f2e;
      --lime:     #c8ff00;
      --lime2:    #a8d600;
      --lime-dim: rgba(200,255,0,0.08);
      --lime-glow:rgba(200,255,0,0.18);
      --white:    #f0f2f8;
      --grey:     #8b90a8;
      --grey2:    #4a4f68;
      --border:   rgba(255,255,255,0.07);
      --border2:  rgba(255,255,255,0.12);

      /* فونت‌های فارسی یکپارچه */
      --disp:     'Vazirmatn', sans-serif;
      --body:     'Vazirmatn', sans-serif;
      --mono:     'Vazirmatn', sans-serif;
    }

    *,
    *::before,
    *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg2); }
    ::-webkit-scrollbar-thumb { background: var(--grey2); border-radius: 4px; }

    body {
      font-family: var(--body);
      font-weight: 300;
      background: var(--bg);
      color: var(--white);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(200,255,0,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(200,255,0,0.025) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    /* بنر بالا */
    .banner {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      height: 52px;
      background: rgba(8,9,13,0.92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 40px;
      gap: 24px;
    }
    .banner-logo {
      font-family: var(--mono);
      font-weight: 700;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--lime);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .banner-sep { width: 1px; height: 20px; background: var(--border2); flex-shrink:0; }

    .search-wrap {
      flex: 1;
      max-width: 460px;
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-icon {
      position: absolute;
      right: 0;
      color: var(--grey);
      width: 16px; height: 16px;
      pointer-events: none;
      flex-shrink: 0;
    }
    #searchInput {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--grey2);
      padding: 6px 26px 6px 0;
      font-family: var(--mono);
      font-weight: 400;
      font-size: 0.8rem;
      color: var(--white);
      outline: none;
      transition: border-color .2s;
      text-align: right;
    }
    #searchInput::placeholder { color: var(--grey2); }
    #searchInput:focus { border-bottom-color: var(--lime); }

    .banner-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-right: auto;
      flex-shrink: 0;
    }
    .banner-stat {
      font-family: var(--mono);
      font-weight: 400;
      font-size: 0.68rem;
      color: var(--grey);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .banner-stat strong { font-weight: 700; color: var(--lime); }

    .reset-btn {
      font-family: var(--mono);
      font-weight: 500;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 6px 14px;
      background: transparent;
      border: 1px solid var(--grey2);
      border-radius: 4px;
      color: var(--grey);
      cursor: pointer;
      transition: all .15s;
    }
    .reset-btn:hover { border-color: var(--lime); color: var(--lime); }

    /* صفحه */
    .page {
      position: relative;
      z-index: 1;
      display: flex;
      min-height: 100vh;
      padding-top: 52px;
    }

    /* ناوبری حروف (راست) */
    .letter-nav {
      position: fixed;
      top: 52px;
      right: 0;
      width: 64px;
      height: calc(100vh - 52px);
      background: var(--bg2);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0;
      gap: 2px;
      overflow-y: auto;
      z-index: 100;
      scrollbar-width: none;
    }
    .letter-nav::-webkit-scrollbar { display:none; }

    .lnav-btn {
      width: 40px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono);
      font-weight: 700;
      font-size: 0.72rem;
      color: var(--grey2);
      background: transparent;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all .14s;
      letter-spacing: 0.04em;
    }
    .lnav-btn:hover:not(.no-terms) {
      background: var(--lime-dim);
      color: var(--lime);
    }
    .lnav-btn.active {
      background: var(--lime);
      color: var(--bg);
      box-shadow: 0 0 12px var(--lime-glow);
    }
    .lnav-btn.no-terms { opacity: 0.2; cursor: default; }

    .lnav-all {
      font-size: 0.58rem;
      letter-spacing: 0.08em;
      width: 40px; height: 28px;
      margin-bottom: 10px;
    }
    .lnav-sep {
      width: 24px; height: 1px;
      background: var(--border);
      margin: 6px 0;
      flex-shrink: 0;
    }

    /* محتوای اصلی */
    .main {
      margin-right: 64px;
      flex: 1;
      max-width: 100%;
    }

    /* هیرو */
    .hero {
      padding: 72px 64px 60px;
      border-bottom: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }
    .hero-bg-text {
      position: absolute;
      bottom: -30px;
      left: -20px;
      font-family: var(--disp);
      font-weight: 900;
      font-size: clamp(120px, 18vw, 220px);
      line-height: 1;
      color: transparent;
      -webkit-text-stroke: 1px rgba(200,255,0,0.06);
      pointer-events: none;
      user-select: none;
      letter-spacing: -0.05em;
    }
    .hero-kicker {
      font-family: var(--mono);
      font-weight: 500;
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--lime);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .hero-kicker::before {
      content: '';
      display: block;
      width: 32px; height: 1px;
      background: var(--lime);
    }
    .hero-title {
      font-family: var(--disp);
      font-weight: 900;
      font-size: clamp(3rem, 6vw, 5.5rem);
      line-height: 1.0;
      letter-spacing: -0.02em;
      color: var(--white);
      margin-bottom: 8px;
    }
    .hero-title em {
      font-style: italic;
      color: var(--lime);
    }
    .hero-subtitle {
      font-family: var(--body);
      font-weight: 300;
      font-size: 1rem;
      color: var(--grey);
      margin-bottom: 36px;
      max-width: 560px;
      line-height: 1.6;
    }
    .hero-chips {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border: 1px solid var(--border2);
      border-radius: 100px;
      font-family: var(--mono);
      font-weight: 400;
      font-size: 0.68rem;
      color: var(--grey);
      background: var(--bg2);
    }
    .chip-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--lime);
      box-shadow: 0 0 6px var(--lime);
      flex-shrink: 0;
    }
    .chip strong { color: var(--white); font-weight: 600; }

    /* بخش واژه‌ها */
    .terms-area {
      padding: 0 64px 80px;
    }
    .letter-group {
      margin-top: 56px;
      animation: groupIn .35s ease both;
    }
    @keyframes groupIn {
      from { opacity:0; transform: translateY(16px); }
      to   { opacity:1; transform: translateY(0); }
    }
    .group-header {
      display: flex;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    .group-letter {
      font-family: var(--disp);
      font-weight: 900;
      font-size: 4.5rem;
      line-height: 1;
      color: var(--lime);
      letter-spacing: -0.03em;
      flex-shrink: 0;
    }
    .group-meta {
      padding-bottom: 8px;
    }
    .group-label {
      font-family: var(--mono);
      font-weight: 500;
      font-size: 0.62rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--grey2);
      margin-bottom: 4px;
    }
    .group-count {
      font-family: var(--body);
      font-weight: 300;
      font-size: 0.88rem;
      color: var(--grey);
    }

    /* کارت‌ها */
    .terms-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 12px;
    }
    .term-card {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 22px 24px;
      position: relative;
      overflow: hidden;
      transition: border-color .2s, background .2s, transform .2s, box-shadow .2s;
      animation: cardIn .3s ease both;
      cursor: pointer;
    }
    @keyframes cardIn {
      from { opacity:0; transform: translateY(8px); }
      to   { opacity:1; transform: translateY(0); }
    }
    .term-card::before {
      content: '';
      position: absolute;
      right: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--lime);
      opacity: 0;
      transition: opacity .2s;
    }
    .term-card:hover {
      border-color: rgba(200,255,0,0.25);
      background: var(--bg4);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0,0,0,.4), 0 0 0 1px rgba(200,255,0,0.1);
    }
    .term-card:hover::before { opacity: 1; }

    .tc-watermark {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-family: var(--disp);
      font-weight: 900;
      font-size: 5rem;
      line-height: 1;
      color: rgba(200,255,0,0.04);
      pointer-events: none;
      user-select: none;
      transition: color .2s;
    }
    .term-card:hover .tc-watermark { color: rgba(200,255,0,0.07); }

    .tc-term {
      font-family: var(--disp);
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--white);
      margin-bottom: 10px;
      line-height: 1.2;
      position: relative;
    }
    .tc-def {
      font-family: var(--body);
      font-weight: 300;
      font-size: 0.88rem;
      color: var(--grey);
      line-height: 1.75;
      position: relative;
    }
    mark.hl {
      background: rgba(200,255,0,0.22);
      color: var(--lime);
      border-radius: 2px;
      padding: 0 2px;
    }

    /* حالت خالی */
    .empty {
      text-align: center;
      padding: 100px 40px;
      color: var(--grey2);
    }
    .empty-char {
      font-family: var(--disp);
      font-weight: 900;
      font-size: 8rem;
      color: transparent;
      -webkit-text-stroke: 1px var(--border2);
      display: block;
      margin-bottom: 20px;
      line-height: 1;
    }
    .empty h3 {
      font-family: var(--disp);
      font-weight: 700;
      font-size: 1.5rem;
      color: var(--grey);
      margin-bottom: 8px;
    }
    .empty p {
      font-weight: 300;
      font-size: 0.88rem;
      color: var(--grey2);
    }

    /* فوتر */
    footer {
      margin-right: 64px;
      border-top: 1px solid var(--border);
      padding: 32px 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }
    .footer-brand {
      font-family: var(--disp);
      font-weight: 700;
      font-size: 1.2rem;
      color: var(--white);
    }
    .footer-brand em { font-style: italic; color: var(--lime); }
    .footer-info {
      font-family: var(--mono);
      font-weight: 400;
      font-size: 0.68rem;
      color: var(--grey2);
      letter-spacing: 0.08em;
      text-align: left;
      line-height: 1.8;
    }

    /* مودال */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      z-index: 999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }

    .modal-box {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 20px;
      max-width: 640px;
      width: 100%;
      padding: 40px 44px;
      position: relative;
      box-shadow: 0 24px 60px rgba(0,0,0,0.7);
      animation: modalIn .25s ease both;
    }
    @keyframes modalIn {
      from { opacity:0; transform: scale(0.96) translateY(12px); }
      to   { opacity:1; transform: scale(1) translateY(0); }
    }
    .modal-close {
      position: absolute;
      left: 16px;
      top: 16px;
      background: transparent;
      border: none;
      color: var(--grey2);
      font-size: 1.6rem;
      cursor: pointer;
      transition: color .2s;
      line-height: 1;
    }
    .modal-close:hover { color: var(--white); }

    .modal-term {
      font-family: var(--disp);
      font-weight: 700;
      font-size: 2.2rem;
      color: var(--white);
      margin-bottom: 18px;
      padding-left: 30px;
    }
    .modal-term .lime { color: var(--lime); }

    .modal-def {
      font-family: var(--body);
      font-weight: 300;
      font-size: 1.05rem;
      line-height: 1.8;
      color: var(--grey);
    }

    /* ریسپانسیو */
    @media (max-width: 860px) {
      .letter-nav { display: none; }
      .main, footer { margin-right: 0; }
      .hero { padding: 48px 24px 40px; }
      .terms-area { padding: 0 24px 60px; }
      .terms-grid { grid-template-columns: 1fr; }
      .banner { padding: 0 20px; }
      .banner-stat { display: none; }
      footer { padding: 24px; margin-right: 0; }
    }
    @media (max-width: 500px) {
      .hero-title { font-size: 2.4rem; }
      .modal-box { padding: 28px 20px; }
    }
  </style>
</head>
<body>

  <!-- بنر بالا -->
  <div class="banner">
    <div class="banner-logo">دیتا ساینس · واژه‌نامه</div>
    <div class="banner-sep"></div>
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="8.5" cy="8.5" r="5.5"/><path d="M15 15l-3-3"/>
      </svg>
      <input id="searchInput" type="text" placeholder="جستجوی واژه یا تعریف…" autocomplete="off">
    </div>
    <div class="banner-actions">
      <div class="banner-stat">نمایش <strong id="bCount">64</strong> از <strong id="bTotal">64</strong></div>
      <button class="reset-btn" id="resetBtn">↺ بازنشانی</button>
    </div>
  </div>

  <div class="page">

    <!-- ناوبری حروف (راست) -->
    <nav class="letter-nav" id="letterNav">
      <button class="lnav-btn lnav-all active" data-l="all">همه</button>
      <div class="lnav-sep"></div>
      <!-- دکمه‌های حروف فارسی توسط JS ساخته می‌شوند -->
    </nav>

    <!-- محتوای اصلی -->
    <div class="main">

      <!-- هیرو -->
      <section class="hero">
        <div class="hero-bg-text">Σ</div>
        <div class="hero-kicker">آکادمی دیتا ساینس</div>
        <h1 class="hero-title">مبانی<br><em>آمار</em></h1>
        <p class="hero-subtitle">
          یک مرجع الفبایی از مفاهیم اساسی آمار برای متخصصان داده، تحلیل‌گران و دانشجویان.
        </p>
        <div class="hero-chips">
          <div class="chip"><div class="chip-dot"></div><strong id="chipCount">64</strong>&nbsp;واژه تعریف‌شده</div>
          <div class="chip"><div class="chip-dot"></div>⏱ ~۷ دقیقه مطالعه</div>
          <div class="chip"><div class="chip-dot"></div>نویسنده:&nbsp;<strong>اسماعیل تقی زاده</strong></div>
        </div>
      </section>

      <!-- منطقه واژه‌ها -->
      <div class="terms-area" id="termsArea">
        <!-- به‌صورت پویا پر می‌شود -->
      </div>

    </div>
  </div>

  <!-- فوتر -->
  <footer>
    <div class="footer-brand">آکادمی <em>دیتا</em> ساینس</div>
    <div class="footer-info">
      مبانی آمار با اکسل<br />
      نویسنده: اسماعیل تقی زاده
    </div>
  </footer>

  <!-- مودال -->
  <div class="modal-overlay" id="termModal">
    <div class="modal-box">
      <button class="modal-close" id="modalClose">✕</button>
      <div class="modal-term" id="modalTermTitle">عنوان</div>
      <div class="modal-def" id="modalTermDef">تعریف</div>
    </div>
  </div>

  <script>
    // ═══════════════════════════════════════════
    //  داده‌های واژه‌نامه (فارسی)
    // ═══════════════════════════════════════════
    const TERMS = [
      { term: "مقدار آلفا", def: "آستانه‌ای برای معنی‌داری آماری در آزمون فرضیه — معمولاً ۰٫۰۵ که یعنی ۵٪ ریسک نتیجه‌گیری اشتباه در مورد وجود تفاوت." },
      { term: "میانگین", def: "مجموع همه مقادیر تقسیم بر تعداد آنها. به آن میانگین حسابی نیز می‌گویند. به داده‌های پرت حساس است." },
      { term: "نمودار ستونی", def: "نمایش تصویری با میله‌های مستطیلی که طول هر میله متناسب با مقدار مورد نظر است. برای مقایسه دسته‌های گسسته مناسب است." },
      { term: "داده‌های کلان", def: "مجموعه‌های بسیار بزرگ و متنوع که با حجم، سرعت و تنوع بالا، از ظرفیت ابزارهای معمولی فراتر می‌روند." },
      { term: "متغیر دودویی", def: "متغیری که دقیقاً دو مقدار ممکن دارد؛ مانند ۰/۱، بله/خیر یا درست/نادرست. حالت خاصی از متغیر طبقه‌ای." },
      { term: "نمودار جعبه‌ای", def: "خلاصه‌ای گرافیکی شامل میانه، چارک‌ها و نقاط پرت. جعبه محدوده بین چارکی را نشان می‌دهد و سبیل‌ها تا نقاط غیرپرتی ادامه دارند." },
      { term: "نمودار حبابی", def: "نمودار پراکندگی با یک متغیر سوم که به‌عنوان اندازه هر دایره کدگذاری می‌شود و امکان نمایش روابط سه‌بعدی را در دو بعد فراهم می‌کند." },
      { term: "تحلیل‌گر کسب‌وکار", def: "متخصص داده‌ای که بین اهداف کسب‌وکار و راه‌حل‌های فنی پل می‌زند؛ نیازمندی‌ها را جمع‌آوری و امکان‌سنجی انجام می‌دهد." },
      { term: "متغیر طبقه‌ای", def: "متغیری که هر مشاهده را بر اساس یک ویژگی کیفی به یک گروه نام‌دار نسبت می‌دهد. شامل اسمی (بدون ترتیب) و ترتیبی (با ترتیب) است." },
      { term: "نمودار شمارشی", def: "نموداری که تعداد وقوع هر دسته را در یک متغیر طبقه‌ای نشان می‌دهد و توزیع فراوانی داده‌های کیفی را نمایش می‌دهد." },

    // مرتب‌سازی بر اساس واژه فارسی
    TERMS.sort((a, b) => a.term.localeCompare(b.term, 'fa'));

    // ═══════════════════════════════════════════
    //  STATE
    // ═══════════════════════════════════════════
    const S = { q: '', letter: 'all' };

    // ═══════════════════════════════════════════
    //  UTILS
    // ═══════════════════════════════════════════
    function esc(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function highlight(text, q) {
      if (!q) return esc(text);
      const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
      return esc(text).replace(re, '<mark class="hl">$1</mark>');
    }

    // ═══════════════════════════════════════════
    //  LETTER NAV (فارسی)
    // ═══════════════════════════════════════════
    function buildLetterNav() {
      const nav = document.getElementById('letterNav');
      const present = new Set(TERMS.map(t => t.term[0]));

      nav.querySelector('[data-l="all"]').addEventListener('click', () => setLetter('all'));

      // حروف فارسی کامل (بدون همزه و ...)
      const persianLetters = 'ابپتثجچحخدذرزژسشصضطظعغفقکگلمنوهی'.split('');
      persianLetters.forEach(l => {
        const btn = document.createElement('button');
        const hasTerm = present.has(l);
        btn.className = 'lnav-btn' + (hasTerm ? '' : ' no-terms');
        btn.dataset.l = l;
        btn.textContent = l;
        if (hasTerm) btn.addEventListener('click', () => setLetter(l));
        nav.appendChild(btn);
      });
    }

    function setLetter(l) {
      S.letter = l;
      S.q = '';
      document.getElementById('searchInput').value = '';
      updateNavActive();
      render();
    }

    function updateNavActive() {
      document.querySelectorAll('.lnav-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.l === S.letter);
      });
    }

    // ═══════════════════════════════════════════
    //  FILTER
    // ═══════════════════════════════════════════
    function getFiltered() {
      const q = S.q.trim().toLowerCase();
      return TERMS.filter(t => {
        const ml = S.letter === 'all' || t.term[0] === S.letter;
        const mq = !q || t.term.includes(q) || t.def.includes(q);
        return ml && mq;
      });
    }

    // ═══════════════════════════════════════════
    //  RENDER
    // ═══════════════════════════════════════════
    function render() {
      const items = getFiltered();
      const area = document.getElementById('termsArea');
      const showGroups = S.letter === 'all' && !S.q;

      document.getElementById('bCount').textContent = items.length;
      document.getElementById('bTotal').textContent = TERMS.length;
      document.getElementById('chipCount').textContent = TERMS.length;

      if (!items.length) {
        area.innerHTML = `<div class="empty">
          <span class="empty-char">∅</span>
          <h3>واژه‌ای یافت نشد</h3>
          <p>کلیدواژه دیگری امتحان کنید یا از حروف الفبا انتخاب کنید.</p>
        </div>`;
        return;
      }

      const groups = {};
      items.forEach(t => {
        const l = t.term[0];
        if (!groups[l]) groups[l] = [];
        groups[l].push(t);
      });

      let html = '';
      Object.keys(groups).sort((a, b) => a.localeCompare(b, 'fa')).forEach(l => {
        html += `<div class="letter-group" id="grp-${l}">`;
        if (showGroups) {
          html += `<div class="group-header">
            <div class="group-letter">${l}</div>
            <div class="group-meta">
              <div class="group-label">گروه حرف</div>
              <div class="group-count">${groups[l].length} واژه</div>
            </div>
          </div>`;
        }
        html += `<div class="terms-grid">`;
        groups[l].forEach((t, i) => {
          html += `<div class="term-card" data-term="${esc(t.term)}" data-def="${esc(t.def)}" style="animation-delay:${i * 0.03}s">
            <div class="tc-watermark">${l}</div>
            <div class="tc-term">${highlight(t.term, S.q)}</div>
            <div class="tc-def">${highlight(t.def, S.q)}</div>
          </div>`;
        });
        html += `</div></div>`;
      });

      area.innerHTML = html;

      document.querySelectorAll('.term-card').forEach(card => {
        card.addEventListener('click', function() {
          const term = this.dataset.term;
          const def = this.dataset.def;
          openModal(term, def);
        });
      });
    }

    // ═══════════════════════════════════════════
    //  MODAL
    // ═══════════════════════════════════════════
    function openModal(term, def) {
      document.getElementById('modalTermTitle').innerHTML = `<span class="lime">●</span> ${term}`;
      document.getElementById('modalTermDef').textContent = def;
      document.getElementById('termModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('termModal').classList.remove('active');
    }

    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('termModal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });

    // ═══════════════════════════════════════════
    //  EVENTS
    // ═══════════════════════════════════════════
    document.getElementById('searchInput').addEventListener('input', e => {
      S.q = e.target.value.trim();
      S.letter = 'all';
      updateNavActive();
      render();
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      S.q = '';
      S.letter = 'all';
      document.getElementById('searchInput').value = '';
      updateNavActive();
      render();
    });

    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
        e.preventDefault();
        document.getElementById('searchInput').focus();
      }
      if (e.key === 'Escape') {
        if (!document.getElementById('termModal').classList.contains('active')) {
          S.q = '';
          document.getElementById('searchInput').value = '';
          render();
        }
      }
    });

    // ═══════════════════════════════════════════
    //  BOOT
    // ═══════════════════════════════════════════
    buildLetterNav();
    render();
  </script>
</body>
</html>
