<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>واژه‌نامه مبانی آمار</title>

  <!-- فونت فارسی باکیفیت -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet" />

  <style>
    /* ===== استایل پایه با فونت فارسی ===== */
    :root {
      --bg:       #08090d;
      --bg2:      #0e1018;
      --bg3:      #14161f;
      --bg4:      #1c1f2e;
      --lime:     #c8ff00;
      --lime2:    #a8d600;
      --lime-dim: rgba(200,255,0,0.08);
      --lime-glow:rgba(200,255,0,0.18);
      --white:    #f0f2f8;
      --grey:     #8b90a8;
      --grey2:    #4a4f68;
      --border:   rgba(255,255,255,0.07);
      --border2:  rgba(255,255,255,0.12);

      /* فونت‌های فارسی یکپارچه */
      --disp:     'Vazirmatn', sans-serif;
      --body:     'Vazirmatn', sans-serif;
      --mono:     'Vazirmatn', sans-serif;
    }

    *,
    *::before,
    *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg2); }
    ::-webkit-scrollbar-thumb { background: var(--grey2); border-radius: 4px; }

    body {
      font-family: var(--body);
      font-weight: 300;
      background: var(--bg);
      color: var(--white);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(200,255,0,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(200,255,0,0.025) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    /* بنر بالا */
    .banner {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      height: 52px;
      background: rgba(8,9,13,0.92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 40px;
      gap: 24px;
    }
    .banner-logo {
      font-family: var(--mono);
      font-weight: 700;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--lime);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .banner-sep { width: 1px; height: 20px; background: var(--border2); flex-shrink:0; }

    .search-wrap {
      flex: 1;
      max-width: 460px;
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-icon {
      position: absolute;
      right: 0;
      color: var(--grey);
      width: 16px; height: 16px;
      pointer-events: none;
      flex-shrink: 0;
    }
    #searchInput {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--grey2);
      padding: 6px 26px 6px 0;
      font-family: var(--mono);
      font-weight: 400;
      font-size: 0.8rem;
      color: var(--white);
      outline: none;
      transition: border-color .2s;
      text-align: right;
    }
    #searchInput::placeholder { color: var(--grey2); }
    #searchInput:focus { border-bottom-color: var(--lime); }

    .banner-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-right: auto;
      flex-shrink: 0;
    }
    .banner-stat {
      font-family: var(--mono);
      font-weight: 400;
      font-size: 0.68rem;
      color: var(--grey);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .banner-stat strong { font-weight: 700; color: var(--lime); }

    .reset-btn {
      font-family: var(--mono);
      font-weight: 500;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 6px 14px;
      background: transparent;
      border: 1px solid var(--grey2);
      border-radius: 4px;
      color: var(--grey);
      cursor: pointer;
      transition: all .15s;
    }
    .reset-btn:hover { border-color: var(--lime); color: var(--lime); }

    /* صفحه */
    .page {
      position: relative;
      z-index: 1;
      display: flex;
      min-height: 100vh;
      padding-top: 52px;
    }

    /* ناوبری حروف (راست) */
    .letter-nav {
      position: fixed;
      top: 52px;
      right: 0;
      width: 64px;
      height: calc(100vh - 52px);
      background: var(--bg2);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0;
      gap: 2px;
      overflow-y: auto;
      z-index: 100;
      scrollbar-width: none;
    }
    .letter-nav::-webkit-scrollbar { display:none; }

    .lnav-btn {
      width: 40px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono);
      font-weight: 700;
      font-size: 0.72rem;
      color: var(--grey2);
      background: transparent;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all .14s;
      letter-spacing: 0.04em;
    }
    .lnav-btn:hover:not(.no-terms) {
      background: var(--lime-dim);
      color: var(--lime);
    }
    .lnav-btn.active {
      background: var(--lime);
      color: var(--bg);
      box-shadow: 0 0 12px var(--lime-glow);
    }
    .lnav-btn.no-terms { opacity: 0.2; cursor: default; }

    .lnav-all {
      font-size: 0.58rem;
      letter-spacing: 0.08em;
      width: 40px; height: 28px;
      margin-bottom: 10px;
    }
    .lnav-sep {
      width: 24px; height: 1px;
      background: var(--border);
      margin: 6px 0;
      flex-shrink: 0;
    }

    /* محتوای اصلی */
    .main {
      margin-right: 64px;
      flex: 1;
      max-width: 100%;
    }

    /* هیرو */
    .hero {
      padding: 72px 64px 60px;
      border-bottom: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }
    .hero-bg-text {
      position: absolute;
      bottom: -30px;
      left: -20px;
      font-family: var(--disp);
      font-weight: 900;
      font-size: clamp(120px, 18vw, 220px);
      line-height: 1;
      color: transparent;
      -webkit-text-stroke: 1px rgba(200,255,0,0.06);
      pointer-events: none;
      user-select: none;
      letter-spacing: -0.05em;
    }
    .hero-kicker {
      font-family: var(--mono);
      font-weight: 500;
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--lime);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .hero-kicker::before {
      content: '';
      display: block;
      width: 32px; height: 1px;
      background: var(--lime);
    }
    .hero-title {
      font-family: var(--disp);
      font-weight: 900;
      font-size: clamp(3rem, 6vw, 5.5rem);
      line-height: 1.0;
      letter-spacing: -0.02em;
      color: var(--white);
      margin-bottom: 8px;
    }
    .hero-title em {
      font-style: italic;
      color: var(--lime);
    }
    .hero-subtitle {
      font-family: var(--body);
      font-weight: 300;
      font-size: 1rem;
      color: var(--grey);
      margin-bottom: 36px;
      max-width: 560px;
      line-height: 1.6;
    }
    .hero-chips {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border: 1px solid var(--border2);
      border-radius: 100px;
      font-family: var(--mono);
      font-weight: 400;
      font-size: 0.68rem;
      color: var(--grey);
      background: var(--bg2);
    }
    .chip-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--lime);
      box-shadow: 0 0 6px var(--lime);
      flex-shrink: 0;
    }
    .chip strong { color: var(--white); font-weight: 600; }

    /* بخش واژه‌ها */
    .terms-area {
      padding: 0 64px 80px;
    }
    .letter-group {
      margin-top: 56px;
      animation: groupIn .35s ease both;
    }
    @keyframes groupIn {
      from { opacity:0; transform: translateY(16px); }
      to   { opacity:1; transform: translateY(0); }
    }
    .group-header {
      display: flex;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    .group-letter {
      font-family: var(--disp);
      font-weight: 900;
      font-size: 4.5rem;
      line-height: 1;
      color: var(--lime);
      letter-spacing: -0.03em;
      flex-shrink: 0;
    }
    .group-meta {
      padding-bottom: 8px;
    }
    .group-label {
      font-family: var(--mono);
      font-weight: 500;
      font-size: 0.62rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--grey2);
      margin-bottom: 4px;
    }
    .group-count {
      font-family: var(--body);
      font-weight: 300;
      font-size: 0.88rem;
      color: var(--grey);
    }

    /* کارت‌ها */
    .terms-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 12px;
    }
    .term-card {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 22px 24px;
      position: relative;
      overflow: hidden;
      transition: border-color .2s, background .2s, transform .2s, box-shadow .2s;
      animation: cardIn .3s ease both;
      cursor: pointer;
    }
    @keyframes cardIn {
      from { opacity:0; transform: translateY(8px); }
      to   { opacity:1; transform: translateY(0); }
    }
    .term-card::before {
      content: '';
      position: absolute;
      right: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--lime);
      opacity: 0;
      transition: opacity .2s;
    }
    .term-card:hover {
      border-color: rgba(200,255,0,0.25);
      background: var(--bg4);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0,0,0,.4), 0 0 0 1px rgba(200,255,0,0.1);
    }
    .term-card:hover::before { opacity: 1; }

    .tc-watermark {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-family: var(--disp);
      font-weight: 900;
      font-size: 5rem;
      line-height: 1;
      color: rgba(200,255,0,0.04);
      pointer-events: none;
      user-select: none;
      transition: color .2s;
    }
    .term-card:hover .tc-watermark { color: rgba(200,255,0,0.07); }

    .tc-term {
      font-family: var(--disp);
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--white);
      margin-bottom: 10px;
      line-height: 1.2;
      position: relative;
    }
    .tc-def {
      font-family: var(--body);
      font-weight: 300;
      font-size: 0.88rem;
      color: var(--grey);
      line-height: 1.75;
      position: relative;
    }
    mark.hl {
      background: rgba(200,255,0,0.22);
      color: var(--lime);
      border-radius: 2px;
      padding: 0 2px;
    }

    /* حالت خالی */
    .empty {
      text-align: center;
      padding: 100px 40px;
      color: var(--grey2);
    }
    .empty-char {
      font-family: var(--disp);
      font-weight: 900;
      font-size: 8rem;
      color: transparent;
      -webkit-text-stroke: 1px var(--border2);
      display: block;
      margin-bottom: 20px;
      line-height: 1;
    }
    .empty h3 {
      font-family: var(--disp);
      font-weight: 700;
      font-size: 1.5rem;
      color: var(--grey);
      margin-bottom: 8px;
    }
    .empty p {
      font-weight: 300;
      font-size: 0.88rem;
      color: var(--grey2);
    }

    /* فوتر */
    footer {
      margin-right: 64px;
      border-top: 1px solid var(--border);
      padding: 32px 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }
    .footer-brand {
      font-family: var(--disp);
      font-weight: 700;
      font-size: 1.2rem;
      color: var(--white);
    }
    .footer-brand em { font-style: italic; color: var(--lime); }
    .footer-info {
      font-family: var(--mono);
      font-weight: 400;
      font-size: 0.68rem;
      color: var(--grey2);
      letter-spacing: 0.08em;
      text-align: left;
      line-height: 1.8;
    }

    /* مودال */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      z-index: 999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }

    .modal-box {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 20px;
      max-width: 720px;
      width: 100%;
      padding: 40px 44px;
      position: relative;
      box-shadow: 0 24px 60px rgba(0,0,0,0.7);
      animation: modalIn .25s ease both;
      max-height: 90vh;
      overflow-y: auto;
    }
    @keyframes modalIn {
      from { opacity:0; transform: scale(0.96) translateY(12px); }
      to   { opacity:1; transform: scale(1) translateY(0); }
    }
    .modal-close {
      position: absolute;
      left: 16px;
      top: 16px;
      background: transparent;
      border: none;
      color: var(--grey2);
      font-size: 1.6rem;
      cursor: pointer;
      transition: color .2s;
      line-height: 1;
    }
    .modal-close:hover { color: var(--white); }

    .modal-term {
      font-family: var(--disp);
      font-weight: 700;
      font-size: 2.2rem;
      color: var(--white);
      margin-bottom: 12px;
      padding-left: 30px;
    }
    .modal-term .lime { color: var(--lime); }

    .modal-def {
      font-family: var(--body);
      font-weight: 300;
      font-size: 1.05rem;
      line-height: 1.8;
      color: var(--grey);
      margin-bottom: 18px;
    }

    .modal-example-label {
      font-family: var(--mono);
      font-weight: 500;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--lime);
      margin-bottom: 6px;
      display: block;
    }

    .modal-example {
      font-family: var(--body);
      font-weight: 300;
      font-size: 1rem;
      line-height: 1.8;
      color: var(--white);
      background: var(--bg3);
      padding: 16px 20px;
      border-radius: 10px;
      border-right: 3px solid var(--lime);
      margin-top: 6px;
    }

    /* ریسپانسیو */
    @media (max-width: 860px) {
      .letter-nav { display: none; }
      .main, footer { margin-right: 0; }
      .hero { padding: 48px 24px 40px; }
      .terms-area { padding: 0 24px 60px; }
      .terms-grid { grid-template-columns: 1fr; }
      .banner { padding: 0 20px; }
      .banner-stat { display: none; }
      footer { padding: 24px; margin-right: 0; }
      .modal-box { padding: 28px 20px; }
    }
    @media (max-width: 500px) {
      .hero-title { font-size: 2.4rem; }
      .modal-term { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

  <!-- بنر بالا -->
  <div class="banner">
    <div class="banner-logo">دیتا ساینس · واژه‌نامه</div>
    <div class="banner-sep"></div>
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="8.5" cy="8.5" r="5.5"/><path d="M15 15l-3-3"/>
      </svg>
      <input id="searchInput" type="text" placeholder="جستجوی واژه یا تعریف…" autocomplete="off">
    </div>
    <div class="banner-actions">
      <div class="banner-stat">نمایش <strong id="bCount">۰</strong> از <strong id="bTotal">۰</strong></div>
      <button class="reset-btn" id="resetBtn">↺ بازنشانی</button>
    </div>
  </div>

  <div class="page">

    <!-- ناوبری حروف (راست) -->
    <nav class="letter-nav" id="letterNav">
      <button class="lnav-btn lnav-all active" data-l="all">همه</button>
      <div class="lnav-sep"></div>
      <!-- دکمه‌های حروف فارسی توسط JS ساخته می‌شوند -->
    </nav>

    <!-- محتوای اصلی -->
    <div class="main">

      <!-- هیرو -->
      <section class="hero">
        <div class="hero-bg-text">Σ</div>
        <div class="hero-kicker">آکادمی دیتا ساینس</div>
        <h1 class="hero-title">مبانی<br><em>آمار</em></h1>
        <p class="hero-subtitle">
          یک مرجع الفبایی از مفاهیم اساسی آمار برای متخصصان داده، تحلیل‌گران و دانشجویان.
        </p>
        <div class="hero-chips">
          <div class="chip"><div class="chip-dot"></div><strong id="chipCount">۰</strong>&nbsp;واژه تعریف‌شده</div>
          <div class="chip"><div class="chip-dot"></div>⏱ ~۱۲ دقیقه مطالعه</div>
          <div class="chip"><div class="chip-dot"></div>نویسنده:&nbsp;<strong>اسماعیل تقی زاده</strong></div>
        </div>
      </section>

      <!-- منطقه واژه‌ها -->
      <div class="terms-area" id="termsArea">
        <!-- به‌صورت پویا پر می‌شود -->
      </div>

    </div>
  </div>

  <!-- فوتر -->
  <footer>
    <div class="footer-brand">آکادمی <em>دیتا</em> ساینس</div>
    <div class="footer-info">
      مبانی آمار با اکسل<br />
      نویسنده: اسماعیل تقی زاده
    </div>
  </footer>

  <!-- مودال -->
  <div class="modal-overlay" id="termModal">
    <div class="modal-box">
      <button class="modal-close" id="modalClose">✕</button>
      <div class="modal-term" id="modalTermTitle">عنوان</div>
      <div class="modal-def" id="modalTermDef">تعریف</div>
      <span class="modal-example-label">📘 مثال</span>
      <div class="modal-example" id="modalTermExample">مثال</div>
    </div>
  </div>

  <script>
    // ═══════════════════════════════════════════
    //  داده‌های واژه‌نامه (فارسی) — ۱۰۱ واژه با مثال
    // ═══════════════════════════════════════════
    const TERMS = [
      { term: "مقدار آلفا", def: "آستانه‌ای برای معنی‌داری آماری در آزمون فرضیه — معمولاً ۰٫۰۵ که یعنی ۵٪ ریسک نتیجه‌گیری اشتباه در مورد وجود تفاوت.", example: "در یک آزمون دارویی، مقدار آلفا را ۰٫۰۵ در نظر می‌گیریم. اگر مقدار P کمتر از ۰٫۰۵ شود، نتیجه می‌گیریم که دارو مؤثر است." },
      { term: "میانگین", def: "مجموع همه مقادیر تقسیم بر تعداد آنها. به آن میانگین حسابی نیز می‌گویند. به داده‌های پرت حساس است.", example: "برای داده‌های ۲، ۴، ۶، ۸، ۱۰ میانگین برابر (۲+۴+۶+۸+۱۰)/۵ = ۶ است." },
      { term: "نمودار ستونی", def: "نمایش تصویری با میله‌های مستطیلی که طول هر میله متناسب با مقدار مورد نظر است. برای مقایسه دسته‌های گسسته مناسب است.", example: "برای نمایش فروش محصولات مختلف در یک ماه، از نمودار ستونی استفاده می‌کنیم تا به راحتی مقایسه شوند." },
      { term: "داده‌های کلان", def: "مجموعه‌های بسیار بزرگ و متنوع که با حجم، سرعت و تنوع بالا، از ظرفیت ابزارهای معمولی فراتر می‌روند.", example: "داده‌های تراکنش‌های روزانه یک فروشگاه آنلاین با میلیون‌ها رکورد، نمونه‌ای از داده‌های کلان است." },
      { term: "متغیر دودویی", def: "متغیری که دقیقاً دو مقدار ممکن دارد؛ مانند ۰/۱، بله/خیر یا درست/نادرست. حالت خاصی از متغیر طبقه‌ای.", example: "وضعیت قبولی در یک آزمون (قبول/رد) یک متغیر دودویی است." },
      { term: "نمودار جعبه‌ای", def: "خلاصه‌ای گرافیکی شامل میانه، چارک‌ها و نقاط پرت. جعبه محدوده بین چارکی را نشان می‌دهد و سبیل‌ها تا نقاط غیرپرتی ادامه دارند.", example: "برای نمایش توزیع نمرات دانشجویان در یک کلاس، از نمودار جعبه‌ای برای شناسایی نقاط پرت استفاده می‌کنیم." },
      { term: "نمودار حبابی", def: "نمودار پراکندگی با یک متغیر سوم که به‌عنوان اندازه هر دایره کدگذاری می‌شود و امکان نمایش روابط سه‌بعدی را در دو بعد فراهم می‌کند.", example: "برای نمایش رابطه بین تولید ناخالص داخلی، جمعیت و امید به زندگی کشورها، از نمودار حبابی استفاده می‌شود." },
      { term: "تحلیل‌گر کسب‌وکار", def: "متخصص داده‌ای که بین اهداف کسب‌وکار و راه‌حل‌های فنی پل می‌زند؛ نیازمندی‌ها را جمع‌آوری و امکان‌سنجی انجام می‌دهد.", example: "یک تحلیل‌گر کسب‌وکار در یک شرکت بیمه، نیازهای مشتریان را تحلیل کرده و راه‌حل‌های نرم‌افزاری مناسب پیشنهاد می‌دهد." },
      { term: "متغیر طبقه‌ای", def: "متغیری که هر مشاهده را بر اساس یک ویژگی کیفی به یک گروه نام‌دار نسبت می‌دهد. شامل اسمی (بدون ترتیب) و ترتیبی (با ترتیب) است.", example: "رنگ چشم (قهوه‌ای، آبی، سبز) یک متغیر طبقه‌ای اسمی و سطح تحصیلات (دیپلم، کارشناسی، ارشد) یک متغیر طبقه‌ای ترتیبی است." },
      { term: "نمودار شمارشی", def: "نموداری که تعداد وقوع هر دسته را در یک متغیر طبقه‌ای نشان می‌دهد و توزیع فراوانی داده‌های کیفی را نمایش می‌دهد.", example: "برای نمایش تعداد دانشجویان هر رشته در یک دانشگاه، از نمودار شمارشی استفاده می‌کنیم." },
      { term: "داده‌های مقطعی", def: "مشاهداتی که از چندین سوژه در یک نقطه زمانی مشخص جمع‌آوری شده‌اند. در مقابل داده‌های سری زمانی قرار دارد.", example: "نظرسنجی از ۱۰۰۰ نفر در مورد رضایت از خدمات یک شرکت در یک ماه خاص، داده مقطعی است." },
      { term: "تابع توزیع تجمعی", def: "تابع F(x) که احتمال اینکه متغیر تصادفی X مقداری ≤ x بگیرد را نشان می‌دهد. از ۰ تا ۱ افزایش می‌یابد و توزیع را کامل توصیف می‌کند.", example: "اگر توزیع نمرات دانشجویان را داشته باشیم، تابع توزیع تجمعی در نمره ۱۵ نشان می‌دهد که چند درصد دانشجویان نمره ≤ ۱۵ گرفته‌اند." },
      { term: "علم داده", def: "حوزه‌ای میان‌رشته‌ای که آمار، علوم کامپیوتر و تخصص حوزه را ترکیب می‌کند تا بینش‌های معنادار و مدل‌های پیش‌بینی‌کننده از داده استخراج کند.", example: "پیش‌بینی قیمت مسکن بر اساس ویژگی‌های مختلف با استفاده از مدل‌های یادگیری ماشین، نمونه‌ای از علم داده است." },
      { term: "روش دلفی", def: "روش ساخت‌یافته پیش‌بینی که نظرات خبرگان را در چند دور ناشناس جمع‌آوری و اصلاح می‌کند تا به اجماع برسد.", example: "پیش‌بینی روندهای فناوری در ۱۰ سال آینده با جمع‌آوری نظرات کارشناسان حوزه فناوری با روش دلفی." },
      { term: "متغیر وابسته", def: "متغیر پیامد در مطالعه که ممکن است در پاسخ به تغییر متغیر مستقل تغییر کند. معمولاً با Y در مدل‌های رگرسیون نشان داده می‌شود.", example: "در مطالعه تأثیر میزان مطالعه بر نمره امتحان، نمره امتحان متغیر وابسته است." },
      { term: "آمار توصیفی", def: "روش‌هایی برای خلاصه‌سازی و توصیف داده‌ها از طریق معیارهای عددی (میانگین، واریانس) یا نمایش‌های بصری (هیستوگرام، جعبه‌ای) بدون استنباط درباره جمعیت.", example: "محاسبه میانگین و انحراف معیار قد دانشجویان یک دانشگاه و رسم هیستوگرام آن، نمونه‌ای از آمار توصیفی است." },
      { term: "متغیر دوگانه", def: "متغیری که دقیقاً دو مقدار متقابل دارد، مانند قبول/رد یا زنده/مرده.", example: "وضعیت زنده بودن یک بیمار پس از عمل جراحی (زنده/فوت) یک متغیر دوگانه است." },
      { term: "پراکندگی", def: "میزان گستردگی مقادیر داده حول یک مرکز. معیارهای رایج شامل دامنه، واریانس، انحراف معیار و دامنه بین‌چارکی است.", example: "اگر نمرات دانشجویان در دو کلاس مختلف را مقایسه کنیم، کلاسی که نمرات پراکنده‌تری دارد، دارای انحراف معیار بزرگتری است." },
      { term: "درون‌زایی", def: "مشکل در رگرسیون که در آن یک متغیر مستقل با جمله خطا همبسته است و منجر به برآوردهای اریب و ناپایدار ضرایب می‌شود.", example: "در مطالعه تأثیر تحصیلات بر درآمد، اگر توانایی ذاتی فرد (که در مدل نیست) با تحصیلات همبسته باشد، دچار درون‌زایی می‌شویم." },
      { term: "آماره F", def: "نسبت دو واریانس که در تحلیل واریانس و آزمون‌های F رگرسیون برای بررسی تفاوت میانگین گروه‌ها یا معنی‌داری کلی مدل استفاده می‌شود.", example: "در تحلیل واریانس برای مقایسه میانگین سه روش تدریس، از آماره F برای تعیین معنی‌داری تفاوت‌ها استفاده می‌شود." },
      { term: "هیستوگرام", def: "نمودار ستونی برای داده‌های پیوسته که مقادیر در بازه‌های هم‌عرض گروه‌بندی می‌شوند. ارتفاع ستون بیانگر فراوانی یا چگالی و شکل توزیع را نشان می‌دهد.", example: "برای نمایش توزیع قد ۱۰۰ دانش‌آموز، داده‌ها را به بازه‌های ۵ سانتی‌متری تقسیم کرده و هیستوگرام رسم می‌کنیم." },
      { term: "هم‌واریانس ثابت", def: "فرضی در رگرسیون که واریانس باقیمانده‌ها در همه سطوح متغیر پیش‌بین ثابت است. نقض آن ناهم‌واریانس نامیده می‌شود.", example: "در مدل پیش‌بینی قیمت خانه بر اساس متراژ، اگر واریانس خطا برای خانه‌های کوچک و بزرگ یکسان باشد، فرض هم‌واریانس ثابت برقرار است." },
      { term: "فرضیه", def: "یک گزاره آزمون‌پذیر و ابطال‌پذیر درباره یک پارامتر جمعیت یا رابطه بین متغیرها که پیش از جمع‌آوری داده فرموله می‌شود.", example: "فرضیه «میانگین نمرات دانشجویان گروه آزمایش بیشتر از گروه کنترل است» یک فرضیه آماری است." },
      { term: "آزمون فرضیه", def: "رویه‌ای رسمی برای تصمیم‌گیری در مورد اینکه آیا داده‌های نمونه شواهد کافی برای رد فرضیه صفر به نفع فرضیه جایگزین فراهم می‌کنند.", example: "برای بررسی اینکه آیا یک داروی جدید مؤثر است، از آزمون فرضیه برای مقایسه میانگین گروه دارو و دارونما استفاده می‌شود." },
      { term: "متغیر مستقل", def: "متغیر پیش‌بین یا توضیحی که تغییرات آن ممکن است تغییرات متغیر وابسته را توضیح دهد. معمولاً با X در رگرسیون نشان داده می‌شود.", example: "در مطالعه تأثیر میزان مطالعه بر نمره امتحان، میزان مطالعه متغیر مستقل است." },
      { term: "رگرسیون خطی", def: "مدلی که رابطه خطی بین یک متغیر وابسته پیوسته و یک یا چند متغیر مستقل را با کمینه‌سازی مجموع مربع باقیمانده‌ها برآورد می‌کند.", example: "پیش‌بینی قیمت مسکن بر اساس متراژ با استفاده از رگرسیون خطی ساده." },
      { term: "خطی بودن", def: "رابطه‌ای که در آن تغییر متغیر وابسته متناسب با تغییر متغیر مستقل است — فرض اصلی رگرسیون خطی.", example: "اگر به ازای هر ۱۰ متر مربع افزایش متراژ، قیمت خانه به طور ثابت ۵ میلیون تومان افزایش یابد، رابطه خطی است." },
      { term: "رگرسیون لجستیک", def: "مدل طبقه‌بندی که احتمال یک پیامد دودویی را با استفاده از تابع لجستیک اعمال‌شده بر ترکیب خطی پیش‌بینی‌کننده‌ها برآورد می‌کند.", example: "پیش‌بینی احتمال خرید یک مشتری بر اساس سن، جنسیت و درآمد با استفاده از رگرسیون لجستیک." },
      { term: "میانگین خطای مطلق", def: "میانگین قدرمطلق تفاوت‌های بین مقادیر پیش‌بینی‌شده و واقعی. نسبت به MSE به نقاط پرت حساسیت کمتری دارد و در همان واحدهای پیامد بیان می‌شود.", example: "اگر خطای پیش‌بینی قیمت سه خانه به ترتیب ۲، ۵- و ۳ میلیون باشد، MAE برابر (۲+۵+۳)/۳ = ۳٫۳۳ میلیون است." },
      { term: "میانه", def: "مقدار وسط وقتی مشاهدات مرتب می‌شوند. نسبت به نقاط پرت مقاوم است و برای توزیع‌های چوله بر میانگین ترجیح داده می‌شود.", example: "برای داده‌های ۱، ۳، ۵، ۷، ۱۰۰، میانه برابر ۵ است (در حالی که میانگین ۲۳٫۲ است و تحت تأثیر عدد ۱۰۰ قرار گرفته)." },
      { term: "نما", def: "مقداری که بیشترین تکرار را در داده دارد. توزیع می‌تواند یک‌نما، دو‌نما یا چند‌نما باشد. تنها میانگین قابل استفاده برای داده‌های اسمی است.", example: "در داده‌های ۲، ۳، ۳، ۴، ۵، ۵، ۵، نما برابر ۵ است." },
      { term: "هم‌خطی چندگانه", def: "همبستگی بالا بین متغیرهای مستقل در یک مدل رگرسیونی که خطای استاندارد را افزایش و برآورد ضرایب را ناپایدار می‌کند.", example: "اگر در مدل پیش‌بینی قیمت خانه، هم متراژ و هم تعداد اتاق‌ها را وارد کنیم که با هم همبستگی بالایی دارند، دچار هم‌خطی چندگانه می‌شویم." },
      { term: "رگرسیون خطی چندگانه", def: "تعمیم رگرسیون خطی ساده که رابطه بین یک متغیر وابسته و دو یا چند متغیر مستقل را همزمان مدل‌سازی می‌کند.", example: "پیش‌بینی قیمت مسکن بر اساس متراژ، تعداد اتاق، سال ساخت و محله با رگرسیون خطی چندگانه." },
      { term: "داده‌های چندمتغیره", def: "داده‌هایی که به ازای هر مشاهده شامل دو یا چند متغیر هستند و تحلیل روابط و تعاملات بین چندین ویژگی را ممکن می‌سازند.", example: "داده‌های مربوط به هر دانشجو شامل نمرات دروس مختلف، سن، جنسیت و رشته تحصیلی، داده چندمتغیره است." },
      { term: "متغیر اسمی", def: "متغیر طبقه‌ای که دسته‌های آن ترتیب ذاتی ندارند؛ مثلاً کشور، رنگ یا گروه خونی.", example: "رنگ‌های مورد علاقه (قرمز، آبی، سبز) یک متغیر اسمی است." },
      { term: "توزیع نرمال", def: "توزیع احتمال متقارن و زنگوله‌ای شکل که با میانگین μ و انحراف معیار σ تعریف می‌شود. حدود ۶۸٪ مقادیر در بازه ±۱σ از میانگین قرار دارند.", example: "قد افراد بزرگسال در یک جامعه معمولاً از توزیع نرمال پیروی می‌کند." },
      { term: "منحنی توزیع نرمال", def: "منحنی چگالی احتمال زنگوله‌ای شکل توزیع نرمال که حول میانگین متقارن است و بیشتر مشاهدات نزدیک مرکز متمرکزند.", example: "نمودار توزیع نمرات استاندارد شده در یک آزمون، یک منحنی زنگوله‌ای شکل است." },
      { term: "فرضیه صفر", def: "فرض پیش‌فرض در آزمون فرضیه — معمولاً عدم تأثیر، عدم تفاوت یا عدم رابطه. با H₀ نشان داده می‌شود و یا رد می‌شود یا نمی‌شود.", example: "در آزمایش تأثیر دارو، فرضیه صفر این است که دارو تأثیری ندارد (میانگین گروه دارو و دارونما برابر است)." },
      { term: "بیش‌برازش", def: "خطای مدل‌سازی که در آن مدل داده‌های آموزشی را بیش از حد دقیق (حتی نویز) یاد می‌گیرد و عملکرد عالی درون‌نمونه‌ای اما تعمیم‌پذیری ضعیف به داده‌های جدید دارد.", example: "مدلی که تمام نوسانات جزئی داده‌های آموزشی را یاد گرفته باشد، روی داده‌های جدید عملکرد ضعیفی خواهد داشت." },
      { term: "نمودار دایره‌ای", def: "نمودار دایره‌ای که به بخش‌هایی متناسب با سهم هر دسته تقسیم می‌شود. برای روابط جزء به کل با تعداد محدود دسته مناسب است.", example: "نمایش سهم هر شرکت از بازار با استفاده از نمودار دایره‌ای." },
      { term: "رگرسیون چندجمله‌ای", def: "گونه‌ای از رگرسیون که در آن رابطه بین Y و X به‌صورت چندجمله‌ای درجه n مدل‌سازی می‌شود و برازش منحنی (غیرخطی) را امکان‌پذیر می‌کند.", example: "پیش‌بینی رشد یک گیاه بر اساس دما که ممکن است رابطه غیرخطی داشته باشد." },
      { term: "احتمال", def: "عددی بین ۰ و ۱ که شانس وقوع یک رویداد را بیان می‌کند. P=۰ یعنی غیرممکن و P=۱ یعنی قطعی. بر اساس اصول نظریه احتمال است.", example: "احتمال اینکه یک تاس سالم عدد ۶ بیاورد برابر ۱/۶ است." },
      { term: "مقدار P", def: "احتمال به‌دست آوردن نتایج حداقل به اندازه مشاهده‌شده، با فرض درستی H₀. مقدار P کوچک (مثلاً <۰٫۰۵) شواهدی علیه H₀ است.", example: "اگر در آزمون تأثیر دارو، مقدار P برابر ۰٫۰۳ شود، یعنی با فرض بی‌اثر بودن دارو، احتمال مشاهده چنین نتایجی ۳٪ است." },
      { term: "پیش‌بینی کیفی", def: "روش‌های پیش‌بینی که به قضاوت خبرگان و نظرات ساخت‌یافته متکی هستند — مانند روش دلفی — نه به داده‌های عددی تاریخی.", example: "پیش‌بینی استقبال از یک محصول جدید بر اساس نظر کارشناسان بازاریابی." },
      { term: "پیش‌بینی کمی", def: "روش‌های پیش‌بینی که از داده‌های عددی تاریخی و مدل‌های آماری — مانند سری زمانی یا رگرسیون — برای پیش‌بینی مقادیر آینده استفاده می‌کنند.", example: "پیش‌بینی فروش ماهانه یک فروشگاه بر اساس داده‌های فروش سال‌های گذشته." },
      { term: "رابطه کمی", def: "رابطه بین متغیرها که به‌صورت عددی قابل اندازه‌گیری است و امکان استفاده از معادلات و مدل‌های آماری را فراهم می‌کند.", example: "رابطه بین دما و مصرف انرژی که با معادله خطی قابل بیان است." },
      { term: "تحلیل رگرسیون", def: "مجموعه‌ای از روش‌های آماری برای برآورد رابطه بین یک متغیر وابسته و یک یا چند متغیر مستقل و استفاده از آن برای پیش‌بینی.", example: "بررسی تأثیر قیمت و تبلیغات بر فروش با استفاده از تحلیل رگرسیون." },
      { term: "مدل رگرسیون", def: "معادله ریاضی — معمولاً Y = β₀ + β₁X + ε — که رابطه برآوردشده بین متغیر وابسته و مستقل را نشان می‌دهد.", example: "مدل قیمت = ۱۰۰۰ + ۵۰ × متراژ + خطا، یک مدل رگرسیون ساده است." },
      { term: "R-squared", def: "نسبت واریانس متغیر وابسته که توسط متغیر(های) مستقل توضیح داده می‌شود، بین ۰ تا ۱. به آن ضریب تعیین نیز می‌گویند.", example: "اگر R-squared یک مدل برابر ۰٫۸ باشد، یعنی ۸۰٪ از تغییرات متغیر وابسته توسط متغیرهای مستقل توضیح داده می‌شود." },
      { term: "نمودار پراکندگی", def: "نمودار دو بعدی که جفت‌های (x, y) را رسم می‌کند تا جهت، قدرت و شکل رابطه بین دو متغیر پیوسته را نشان دهد.", example: "رسم نمودار پراکندگی بین ساعات مطالعه و نمرات دانشجویان برای مشاهده رابطه آنها." },
      { term: "رگرسیون خطی ساده", def: "مدل رگرسیونی با دقیقاً یک متغیر مستقل که خط بهترین برازش Y = β₀ + β₁X + ε را از میان داده‌ها تولید می‌کند.", example: "پیش‌بینی وزن بر اساس قد با استفاده از رگرسیون خطی ساده." },
      { term: "چولگی", def: "معیار عدم تقارن در توزیع. چولگی مثبت به معنای دنباله راست بلندتر و چولگی منفی به معنای دنباله چپ بلندتر است.", example: "توزیع درآمد در یک جامعه معمولاً چولگی مثبت دارد (دنباله راست بلندتر)." },
      { term: "انحراف معیار", def: "ریشه دوم واریانس — معیاری برای میانگین فاصله مشاهدات از میانگین که در همان واحدهای داده بیان می‌شود.", example: "اگر انحراف معیار نمرات دانشجویان ۳ باشد، یعنی نمرات به طور متوسط ۳ نمره با میانگین فاصله دارند." },
      { term: "خطای استاندارد", def: "انحراف معیار توزیع نمونه‌گیری، معمولاً برای میانگین نمونه. نشان می‌دهد که یک آماره چقدر از نمونه‌ای به نمونه دیگر تغییر می‌کند.", example: "اگر خطای استاندارد میانگین نمونه ۲ باشد، یعنی میانگین نمونه‌های مختلف معمولاً حدود ۲ واحد با میانگین واقعی تفاوت دارند." },
      { term: "تحلیل آماری", def: "فرآیند جمع‌آوری، پاک‌سازی، اکتشاف، مدل‌سازی و تفسیر داده‌ها برای کشف الگوها، آزمون فرضیه‌ها و پشتیبانی از تصمیم‌گیری.", example: "تحلیل داده‌های فروش یک شرکت برای یافتن الگوهای فصلی و بهبود استراتژی بازاریابی." },
      { term: "پارامتر آماری", def: "ویژگی عددی یک جمعیت — مانند میانگین (μ) یا انحراف معیار (σ) — در مقابل آماره نمونه که از داده برآورد می‌شود.", example: "میانگین قد همه دانشجویان یک دانشگاه یک پارامتر است، در حالی که میانگین قد یک نمونه ۱۰۰ نفری یک آماره است." },
      { term: "ابزارهای آماری", def: "نرم‌افزارها و کتابخانه‌هایی مانند اکسل، R، پایتون (pandas, scipy)، SAS و SPSS که برای اجرای روش‌های آماری استفاده می‌شوند.", example: "برای تحلیل داده‌های بزرگ از پایتون با کتابخانه pandas استفاده می‌شود." },
      { term: "آمار", def: "علم جمع‌آوری، تحلیل، تفسیر و ارائه داده‌ها برای درک تغییرپذیری، استنباط و پشتیبانی از تصمیم‌گیری.", example: "استفاده از روش‌های آماری برای تحلیل نتایج یک نظرسنجی سیاسی." },
      { term: "توزیع متقارن", def: "توزیعی که دو نیمه چپ و راست آن آینه‌ای یکدیگرند و در نتیجه میانگین، میانه و نما با هم برابر می‌شوند.", example: "توزیع نرمال یک توزیع متقارن است." },
      { term: "توزیع t", def: "توزیع احتمال زنگوله‌ای شکل که وقتی انحراف معیار جمعیت ناشناخته و حجم نمونه کوچک است استفاده می‌شود. دنباله‌های پهن‌تری نسبت به توزیع نرمال دارد.", example: "برای آزمون میانگین یک نمونه کوچک (n<۳۰) وقتی انحراف معیار جمعیت ناشناخته است، از توزیع t استفاده می‌شود." },
      { term: "کم‌برازش", def: "خطای مدل‌سازی که در آن مدل بسیار ساده است و ساختار زیرین را نمی‌گیرد، در نتیجه خطای بالا در هر دو داده آموزشی و تست دارد.", example: "استفاده از یک خط مستقیم برای داده‌هایی که الگوی منحنی دارند، منجر به کم‌برازش می‌شود." },
      { term: "داده‌های تک‌متغیره", def: "داده‌هایی که به ازای هر مشاهده فقط یک متغیر دارند. با توزیع فراوانی، هیستوگرام و آماره‌های خلاصه تحلیل می‌شوند.", example: "داده‌های مربوط به قد ۵۰ دانش‌آموز، یک داده تک‌متغیره است." },
      { term: "عوامل تورم واریانس (VIF)", def: "آزمایشی تشخیصی که نشان می‌دهد واریانس یک ضریب رگرسیون چقدر به دلیل هم‌خطی چندگانه افزایش یافته است. VIF > ۱۰ معمولاً نشانه مشکل است.", example: "اگر در مدل پیش‌بینی قیمت خانه، VIF برای متغیر متراژ برابر ۱۲ باشد، نشان دهنده هم‌خطی شدید است." },
      { term: "نمره Z", def: "اندازه‌ای استانداردشده که نشان می‌دهد یک مشاهده چند انحراف معیار از میانگین فاصله دارد: z = (x − μ) / σ. مقایسه در مقیاس‌های مختلف را ممکن می‌کند.", example: "نمره Z برای دانشجویی که نمره ۱۸ از ۲۰ گرفته در حالی که میانگین ۱۴ و انحراف معیار ۲ است، برابر (۱۸-۱۴)/۲ = ۲ است." },

      // ===== واژه‌های جدید با مثال =====
      { term: "تحلیل واریانس (ANOVA)", def: "روش آماری برای مقایسه میانگین سه یا چند گروه به‌طور همزمان با استفاده از تحلیل واریانس.", example: "مقایسه میانگین نمرات دانشجویان سه رشته مختلف با استفاده از ANOVA." },
      { term: "سوگیری (Bias)", def: "خطای سیستماتیک که باعث می‌شود برآوردها از مقدار واقعی جمعیت منحرف شوند.", example: "اگر در یک نظرسنجی تلفنی فقط از افرادی که پاسخگو هستند نمونه‌گیری شود، ممکن است سوگیری ایجاد شود." },
      { term: "قضیه حد مرکزی", def: "توزیع میانگین‌های نمونه‌ای با افزایش حجم نمونه به توزیع نرمال نزدیک می‌شود، صرف‌نظر از توزیع اصلی جامعه.", example: "حتی اگر توزیع درآمد در جامعه چوله باشد، با نمونه‌های بزرگ (n>۳۰)، توزیع میانگین نمونه‌ها به نرمال نزدیک می‌شود." },
      { term: "آزمون کای‌دو", def: "آزمونی برای بررسی ارتباط بین دو متغیر طبقه‌ای با مقایسه فراوانی‌های مشاهده‌شده و انتظاری.", example: "بررسی ارتباط بین جنسیت و ترجیح برند با استفاده از آزمون کای‌دو." },
      { term: "ضریب تغییرات", def: "نسبت انحراف معیار به میانگین که تغییرپذیری را نسبت به میانگین نشان می‌دهد و برای مقایسه پراکندگی در مقیاس‌های مختلف مفید است.", example: "اگر انحراف معیار قیمت خودروها ۵ میلیون و میانگین ۵۰ میلیون باشد، ضریب تغییرات ۱۰٪ است." },
      { term: "فاصله اطمینان", def: "بازه‌ای از مقادیر که با سطح اطمینان مشخص، پارامتر جامعه را در بر می‌گیرد.", example: "فاصله اطمینان ۹۵٪ برای میانگین قد دانشجویان بین ۱۷۰ تا ۱۷۵ سانتی‌متر است." },
      { term: "متغیر مخدوش‌کننده", def: "متغیر خارجی که هم با متغیر مستقل و هم با متغیر وابسته همبسته است و می‌تواند رابطه واقعی را مخدوش کند.", example: "در مطالعه تأثیر مصرف قهوه بر بیماری قلبی، سن می‌تواند یک متغیر مخدوش‌کننده باشد." },
      { term: "متغیر پیوسته", def: "متغیری که می‌تواند هر مقداری را در یک بازه مشخص اختیار کند (مانند وزن، زمان).", example: "وزن یک فرد یک متغیر پیوسته است (می‌تواند ۷۰٫۵ کیلوگرم باشد)." },
      { term: "همبستگی", def: "اندازه‌ای از قدرت و جهت رابطه خطی بین دو متغیر که در بازه ۱- تا ۱+ قرار دارد.", example: "همبستگی بین ساعات مطالعه و نمره معمولاً مثبت و حدود ۰٫۷ است." },
      { term: "کوواریانس", def: "اندازه‌ای از تغییرپذیری مشترک دو متغیر تصادفی که نشان می‌دهد چگونه با هم تغییر می‌کنند.", example: "کوواریانس مثبت بین دما و فروش بستنی نشان می‌دهد که با افزایش دما، فروش بستنی افزایش می‌یابد." },
      { term: "داده‌کاوی", def: "فرآیند کشف الگوها و دانش از مجموعه‌داده‌های بزرگ با استفاده از روش‌های آماری و یادگیری ماشین.", example: "استفاده از داده‌کاوی برای شناسایی مشتریان پرخطر در یک بانک." },
      { term: "درجه آزادی", def: "تعداد اطلاعات مستقل موجود برای برآورد یک پارامتر؛ معمولاً با n-1 برای نمونه محاسبه می‌شود.", example: "برای یک نمونه ۳۰ نفری، درجه آزادی برای محاسبه واریانس برابر ۲۹ است." },
      { term: "متغیر گسسته", def: "متغیری که فقط مقادیر مشخص و مجزا می‌تواند بگیرد (مانند تعداد فرزندان، تعداد دفعات).", example: "تعداد فرزندان یک خانواده یک متغیر گسسته است (۰، ۱، ۲، ...)." },
      { term: "اندازه اثر", def: "معیار کمی برای بزرگی یک پدیده یا تأثیر درمان که مستقل از حجم نمونه است.", example: "اندازه اثر برای تفاوت میانگین دو گروه می‌تواند کوچک، متوسط یا بزرگ باشد." },
      { term: "برآوردگر", def: "آماره‌ای که برای برآورد یک پارامتر جمعیت استفاده می‌شود (مثلاً میانگین نمونه برآوردگر میانگین جامعه).", example: "میانگین نمونه یک برآوردگر برای میانگین جامعه است." },
      { term: "مقدار انتظاری", def: "میانگین وزنی همه مقادیر ممکن یک متغیر تصادفی که به‌عنوان میانگین بلندمدت تعبیر می‌شود.", example: "در یک تاس سالم، مقدار انتظاری برابر ۳٫۵ است." },
      { term: "برازش خوب", def: "معیاری که نشان می‌دهد مدل آماری چقدر داده‌های مشاهده‌شده را به‌خوبی توصیف می‌کند.", example: "با استفاده از آماره R-squared یا آزمون کای‌دو، برازش مدل را ارزیابی می‌کنیم." },
      { term: "استنباط", def: "فرآیند نتیجه‌گیری درباره یک جمعیت از روی داده‌های نمونه.", example: "با استفاده از نظرسنجی از ۱۰۰۰ نفر، درباره رأی کل جمعیت کشور استنباط می‌کنیم." },
      { term: "کشیدگی", def: "معیاری برای «دم‌دار بودن» توزیع احتمال که نشان می‌دهد چقدر داده در دنباله‌ها متمرکز است.", example: "توزیع با کشیدگی مثبت، دنباله‌های سنگین‌تری دارد." },
      { term: "درست‌نمایی", def: "احتمال مشاهده داده‌ها با فرض پارامترهای معین مدل؛ مبنای روش بیش‌درست‌نمایی.", example: "تابع درست‌نمایی برای یک داده، احتمال وقوع آن داده با پارامترهای خاص را نشان می‌دهد." },
      { term: "بیش‌درست‌نمایی (MLE)", def: "روشی برای برآورد پارامترها که با بیشینه‌سازی تابع درست‌نمایی، پارامترهایی را می‌یابد که داده را محتمل‌تر می‌کنند.", example: "برای برآورد میانگین و واریانس یک توزیع نرمال، از روش بیش‌درست‌نمایی استفاده می‌شود." },
      { term: "میانگین مربعات خطا (MSE)", def: "میانگین مجذور تفاوت‌های بین مقادیر پیش‌بینی‌شده و واقعی؛ معیاری برای دقت مدل.", example: "اگر خطای پیش‌بینی سه خانه به ترتیب ۲، ۵- و ۳ میلیون باشد، MSE برابر (۴+۲۵+۹)/۳ = ۱۲٫۶۷ است." },
      { term: "غیرپارامتری", def: "روش آماری که توزیع خاصی را برای داده فرض نمی‌کند و برای داده‌های ترتیبی یا اسمی مناسب است.", example: "آزمون من-ویتنی یک روش غیرپارامتری برای مقایسه دو گروه مستقل است." },
      { term: "مطالعه مشاهده‌ای", def: "مطالعه‌ای که محقق بدون مداخله، صرفاً به مشاهده و ثبت داده‌ها می‌پردازد.", example: "بررسی رابطه بین رژیم غذایی و بیماری قلبی با مشاهده عادات غذایی افراد." },
      { term: "نقطه پرت", def: "مشاهده‌ای که فاصله زیادی از بقیه داده‌ها دارد و می‌تواند بر تحلیل تأثیر بگذارد.", example: "در داده‌های ۲، ۴، ۶، ۸، ۱۰۰، عدد ۱۰۰ یک نقطه پرت است." },
      { term: "برآورد نقطه‌ای", def: "یک مقدار واحد که برای برآورد یک پارامتر جمعیت استفاده می‌شود.", example: "میانگین نمونه (مثلاً ۷۰ کیلوگرم) یک برآورد نقطه‌ای برای میانگین وزن جمعیت است." },
      { term: "جمعیت", def: "مجموعه کامل همه افراد یا اشیاء مورد نظر در یک مطالعه.", example: "تمامی دانشجویان دانشگاه تهران جمعیت مورد نظر برای یک مطالعه است." },
      { term: "توان آماری", def: "احتمال رد صحیح فرضیه صفر نادرست؛ یعنی احتمال تشخیص یک اثر واقعی.", example: "توان آماری ۰٫۸ یعنی ۸۰٪ احتمال اینکه یک تفاوت واقعی را تشخیص دهیم." },
      { term: "متغیر تصادفی", def: "متغیری که مقادیر آن نتیجه یک پدیده تصادفی است و با توزیع احتمال مشخص می‌شود.", example: "تعداد دفعاتی که یک سکه سالم در ۱۰ بار پرتاب، رو می‌آید یک متغیر تصادفی است." },
      { term: "دامنه", def: "تفاوت بین بزرگترین و کوچکترین مقدار در یک مجموعه داده.", example: "برای داده‌های ۱۰، ۲۰، ۳۰، ۴۰، دامنه برابر ۳۰ است." },
      { term: "باقیمانده", def: "تفاوت بین مقدار مشاهده‌شده و مقدار پیش‌بینی‌شده توسط مدل.", example: "اگر مدل قیمت خانه‌ای را ۲۰۰ میلیون پیش‌بینی کند ولی قیمت واقعی ۲۱۰ میلیون باشد، باقیمانده ۱۰- میلیون است." },
      { term: "نمونه", def: "زیرمجموعه‌ای از جمعیت که برای تحلیل انتخاب می‌شود.", example: "از بین ۱۰۰۰۰ دانشجو، ۵۰۰ نفر به عنوان نمونه انتخاب می‌شوند." },
      { term: "توزیع نمونه‌گیری", def: "توزیع احتمال یک آماره (مانند میانگین) در صورت تکرار نمونه‌گیری تصادفی.", example: "اگر ۱۰۰ بار نمونه‌گیری کنیم و هر بار میانگین را محاسبه کنیم، توزیع این میانگین‌ها، توزیع نمونه‌گیری نامیده می‌شود." },
      { term: "آماره آزمون", def: "مقداری محاسبه‌شده از داده‌های نمونه که در آزمون فرضیه برای تصمیم‌گیری استفاده می‌شود.", example: "در آزمون t، آماره آزمون t محاسبه شده و با مقدار بحرانی مقایسه می‌شود." },
      { term: "خطای نوع اول", def: "رد فرضیه صفر در حالی که درست است (نتیجه مثبت کاذب).", example: "نتیجه‌گیری اینکه دارو مؤثر است در حالی که در واقع مؤثر نیست، یک خطای نوع اول است." },
      { term: "خطای نوع دوم", def: "رد نکردن فرضیه صفر در حالی که نادرست است (نتیجه منفی کاذب).", example: "نتیجه‌گیری اینکه دارو مؤثر نیست در حالی که در واقع مؤثر است، یک خطای نوع دوم است." },
      { term: "واریانس", def: "میانگین مجذور انحرافات از میانگین که معیاری برای پراکندگی داده‌هاست.", example: "اگر انحرافات از میانگین بزرگ باشد، واریانس بزرگ خواهد بود." }
    ];

    // مرتب‌سازی بر اساس واژه فارسی
    TERMS.sort((a, b) => a.term.localeCompare(b.term, 'fa'));

    // ═══════════════════════════════════════════
    //  STATE
    // ═══════════════════════════════════════════
    const S = { q: '', letter: 'all' };

    // ═══════════════════════════════════════════
    //  UTILS
    // ═══════════════════════════════════════════
    function esc(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function highlight(text, q) {
      if (!q) return esc(text);
      const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
      return esc(text).replace(re, '<mark class="hl">$1</mark>');
    }

    // ═══════════════════════════════════════════
    //  LETTER NAV (فارسی)
    // ═══════════════════════════════════════════
    function buildLetterNav() {
      const nav = document.getElementById('letterNav');
      const present = new Set(TERMS.map(t => t.term[0]));

      nav.querySelector('[data-l="all"]').addEventListener('click', () => setLetter('all'));

      const persianLetters = 'ابپتثجچحخدذرزژسشصضطظعغفقکگلمنوهی'.split('');
      persianLetters.forEach(l => {
        const btn = document.createElement('button');
        const hasTerm = present.has(l);
        btn.className = 'lnav-btn' + (hasTerm ? '' : ' no-terms');
        btn.dataset.l = l;
        btn.textContent = l;
        if (hasTerm) btn.addEventListener('click', () => setLetter(l));
        nav.appendChild(btn);
      });
    }

    function setLetter(l) {
      S.letter = l;
      S.q = '';
      document.getElementById('searchInput').value = '';
      updateNavActive();
      render();
    }

    function updateNavActive() {
      document.querySelectorAll('.lnav-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.l === S.letter);
      });
    }

    // ═══════════════════════════════════════════
    //  FILTER
    // ═══════════════════════════════════════════
    function getFiltered() {
      const q = S.q.trim().toLowerCase();
      return TERMS.filter(t => {
        const ml = S.letter === 'all' || t.term[0] === S.letter;
        const mq = !q || t.term.includes(q) || t.def.includes(q) || (t.example && t.example.includes(q));
        return ml && mq;
      });
    }

    // ═══════════════════════════════════════════
    //  RENDER
    // ═══════════════════════════════════════════
    function render() {
      const items = getFiltered();
      const area = document.getElementById('termsArea');
      const showGroups = S.letter === 'all' && !S.q;

      document.getElementById('bCount').textContent = items.length;
      document.getElementById('bTotal').textContent = TERMS.length;
      document.getElementById('chipCount').textContent = TERMS.length;

      if (!items.length) {
        area.innerHTML = `<div class="empty">
          <span class="empty-char">∅</span>
          <h3>واژه‌ای یافت نشد</h3>
          <p>کلیدواژه دیگری امتحان کنید یا از حروف الفبا انتخاب کنید.</p>
        </div>`;
        return;
      }

      const groups = {};
      items.forEach(t => {
        const l = t.term[0];
        if (!groups[l]) groups[l] = [];
        groups[l].push(t);
      });

      let html = '';
      Object.keys(groups).sort((a, b) => a.localeCompare(b, 'fa')).forEach(l => {
        html += `<div class="letter-group" id="grp-${l}">`;
        if (showGroups) {
          html += `<div class="group-header">
            <div class="group-letter">${l}</div>
            <div class="group-meta">
              <div class="group-label">گروه حرف</div>
              <div class="group-count">${groups[l].length} واژه</div>
            </div>
          </div>`;
        }
        html += `<div class="terms-grid">`;
        groups[l].forEach((t, i) => {
          // برای ذخیره مثال در data-example
          html += `<div class="term-card" 
            data-term="${esc(t.term)}" 
            data-def="${esc(t.def)}" 
            data-example="${esc(t.example || 'مثالی برای این واژه ثبت نشده است.')}" 
            style="animation-delay:${i * 0.03}s">
            <div class="tc-watermark">${l}</div>
            <div class="tc-term">${highlight(t.term, S.q)}</div>
            <div class="tc-def">${highlight(t.def, S.q)}</div>
          </div>`;
        });
        html += `</div></div>`;
      });

      area.innerHTML = html;

      document.querySelectorAll('.term-card').forEach(card => {
        card.addEventListener('click', function() {
          const term = this.dataset.term;
          const def = this.dataset.def;
          const example = this.dataset.example;
          openModal(term, def, example);
        });
      });
    }

    // ═══════════════════════════════════════════
    //  MODAL
    // ═══════════════════════════════════════════
    function openModal(term, def, example) {
      document.getElementById('modalTermTitle').innerHTML = `<span class="lime">●</span> ${term}`;
      document.getElementById('modalTermDef').textContent = def;
      document.getElementById('modalTermExample').textContent = example || 'مثالی برای این واژه ثبت نشده است.';
      document.getElementById('termModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('termModal').classList.remove('active');
    }

    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('termModal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });

    // ═══════════════════════════════════════════
    //  EVENTS
    // ═══════════════════════════════════════════
    document.getElementById('searchInput').addEventListener('input', e => {
      S.q = e.target.value.trim();
      S.letter = 'all';
      updateNavActive();
      render();
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      S.q = '';
      S.letter = 'all';
      document.getElementById('searchInput').value = '';
      updateNavActive();
      render();
    });

    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
        e.preventDefault();
        document.getElementById('searchInput').focus();
      }
      if (e.key === 'Escape') {
        if (!document.getElementById('termModal').classList.contains('active')) {
          S.q = '';
          document.getElementById('searchInput').value = '';
          render();
        }
      }
    });

    // ═══════════════════════════════════════════
    //  BOOT
    // ═══════════════════════════════════════════
    buildLetterNav();
    render();
  </script>
</body>
</html>
